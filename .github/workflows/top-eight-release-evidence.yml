name: Top 30 Release Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test top-30 registry, dashboard and fail-closed release logic
        run: node --test tools/studio-hub-qa/release-gate.test.mjs tools/studio-hub-qa/top30.test.mjs
      - name: Verify registered GitHub Actions evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/studio-hub-qa/verify-github-evidence.mjs
      - name: Verify historical CI run metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/studio-hub-qa/historical-ci.mjs
      - name: Validate evidence registry (non-enforcing pilot)
        run: node tools/studio-hub-qa/release-gate.mjs
      - name: Publish gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-30-release-gate
          path: |
            tools/studio-hub-qa/release-gate-report.json
            tools/studio-hub-qa/github-evidence-report.json
            tools/studio-hub-qa/historical-ci-report.json
            tools/studio-hub-qa/projects.json
            tools/studio-hub-qa/dashboard/index.html
          retention-days: 30
