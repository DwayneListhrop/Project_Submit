name: Portfolio Platform CI

on:
  push:
    branches: [main, build-studio-v5-6-production]
    paths:
      - 'portfolio-platform/**'
      - '.github/workflows/portfolio-platform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'portfolio-platform/**'
      - '.github/workflows/portfolio-platform-ci.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-platform-dist
          path: portfolio-platform/dist
          if-no-files-found: error
          retention-days: 14
