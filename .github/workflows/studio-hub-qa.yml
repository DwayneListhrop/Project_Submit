name: Studio Hub QA
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # GitHub cron uses UTC; 02:00/14:00 UTC approximates 8 PM/8 AM CST (DST shifts one hour).
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional deployed preview URL to test (leave empty to only test QA harness)'
        required: false
        type: string
      run_xcode:
        description: 'Run native Xcode tests if an Xcode project and shared scheme exist'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: studio-hub-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Browser smoke and QA report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/studio-hub-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Build portfolio application
        run: npm install --no-audit --no-fund && npm run build
        working-directory: portfolio-platform
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        id: tests
        continue-on-error: true
        env:
          STUDIO_TARGET_URL: ${{ inputs.target_url }}
        run: npx playwright test
      - name: Write normalized QA JSON
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          STUDIO_TARGET_URL: ${{ inputs.target_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node report.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-hub-browser-qa
          path: |
            tools/studio-hub-qa/qa-report.json
            tools/studio-hub-qa/results.json
            tools/studio-hub-qa/test-results/
          retention-days: 30
      - name: Enforce browser release gate
        if: steps.tests.outcome != 'success'
        run: exit 1
  xcode:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_xcode }}
    name: Native XCTest (opt-in)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Locate Xcode project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          project=$(find . -name '*.xcodeproj' -not -path '*/Pods/*' -print -quit)
          workspace=$(find . -name '*.xcworkspace' -not -path '*/Pods/*' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "container=$workspace" >> "$GITHUB_OUTPUT"
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "container=$project" >> "$GITHUB_OUTPUT"
            echo "kind=project" >> "$GITHUB_OUTPUT"
          else
            echo "No Xcode project/workspace found"; exit 1
          fi
      - name: Run native test suite
        env:
          CONTAINER: ${{ steps.locate.outputs.container }}
          KIND: ${{ steps.locate.outputs.kind }}
          STUDIO_XCODE_SCHEME: ${{ vars.STUDIO_XCODE_SCHEME }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STUDIO_XCODE_SCHEME" ]]; then
            echo "::error::Set repository variable STUDIO_XCODE_SCHEME to a shared testable scheme"; exit 1
          fi
          if [[ "$KIND" == "workspace" ]]; then flag="-workspace"; else flag="-project"; fi
          xcodebuild test "$flag" "$CONTAINER" -scheme "$STUDIO_XCODE_SCHEME" -destination 'platform=iOS Simulator,name=iPhone 16' -resultBundlePath "$RUNNER_TEMP/StudioHub.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-hub-xctest
          path: ${{ runner.temp }}/StudioHub.xcresult
          retention-days: 30
