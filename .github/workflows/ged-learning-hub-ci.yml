name: GED Learning Hub Release Checks
on:
  pull_request:
    paths:
      - 'apps/ged-learning-hub/**'
  push:
    paths:
      - 'apps/ged-learning-hub/**'
jobs:
  static-release-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ged-learning-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run lint:html
