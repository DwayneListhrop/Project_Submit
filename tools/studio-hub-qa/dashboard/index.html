<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D_Builds • Studio Hub V4</title><style>:root{font:16px system-ui;color-scheme:dark;background:#0b1221;color:#eef3fa}*{box-sizing:border-box}body{margin:0;max-width:1350px;padding:clamp(16px,4vw,46px);margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:clamp(28px,4vw,44px);margin:8px 0}p,small{color:#aab9d0}section{margin:25px 0} .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric,.panel{background:#142039;border:1px solid #33445d;border-radius:18px;padding:20px}.metric strong{display:block;font-size:32px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select{min-height:48px;border:1px solid #617594;border-radius:12px;padding:12px;background:#182842;color:#fff;font:inherit}input{flex:2;min-width:200px}select{flex:1;min-width:175px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px;border-bottom:1px solid #31415b;vertical-align:top}th{color:#b0c1db}td small{display:block;margin-top:4px}.pill{border-radius:99px;background:#493520;color:#ffdf9e;padding:5px 10px;white-space:nowrap;font-size:13px}.muted{color:#b3bed0}a{color:#9ecfff}a:focus,input:focus,select:focus{outline:3px solid #7fc7ff;outline-offset:3px}@media(max-width:750px){.wide{overflow-x:auto}table{min-width:730px}}</style><header><div><small>D_BUILDS / COMMAND CENTER</small><h1>Studio Hub <span style="color:#8ac8fc">V4</span></h1><p>Top 30 · Evidence-based portfolio intelligence</p></div><span class="pill">Release gates: fail-closed</span></header><section class="metrics" id="metrics" aria-label="Portfolio totals"></section><section class="panel"><div class="controls"><input id="search" aria-label="Search projects" placeholder="Search project or category"><select id="status" aria-label="Filter status"><option value="">All evidence statuses</option><option value="ci">Historical CI observed</option><option value="missing">Unverified CI</option></select><select id="kind" aria-label="Filter project type"><option value="">All project types</option><option value="project">Projects</option><option value="module">Modules</option><option value="candidate-module">Candidate modules</option><option value="platform">Platform</option></select></div><div class="wide"><table><thead><tr><th>Rank</th><th>Project</th><th>Source / version</th><th>QA evidence</th><th>Release</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count" aria-live="polite"></p></section><p>Only immutable source, release artifacts, and independently verifiable checks can qualify a build. Historic CI is not release approval.</p><script type="module">
const $=x=>document.getElementById(x);
async function load(){const resp=await fetch('./projects.json',{cache:'no-store'});if(!resp.ok)throw Error('Could not read project registry');return (await resp.json()).projects;}
try{const data=await load();const counts={total:data.length,ci:data.filter(x=>x.observed_ci?.length).length,modules:data.filter(x=>x.kind.includes('module')).length,approved:data.filter(x=>x.release_status==='approved').length};const labels=[['Ranked builds',counts.total],['Historical CI tracked',counts.ci],['Modules to reconcile',counts.modules],['Certified releases',counts.approved]];for(const [label,n] of labels){const card=document.createElement('div');card.className='metric';const title=document.createElement('small');title.textContent=label;const num=document.createElement('strong');num.textContent=n;card.append(title,num);$('metrics').append(card)}
function cell(tr,value,sub){const td=document.createElement('td');td.textContent=value; if(sub){const s=document.createElement('small');s.textContent=sub;td.append(s)}tr.append(td);return td;}
function render(){const q=$('search').value.toLowerCase(),status=$('status').value,kind=$('kind').value;const filtered=data.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)&&(!kind||p.kind===kind)&&(!status||(status==='ci'?Boolean(p.observed_ci?.length):!p.observed_ci?.length)));$('rows').replaceChildren();for(const p of filtered){const tr=document.createElement('tr');cell(tr,'#'+p.rank);cell(tr,p.name,p.category+(p.parent_id?' • related: '+p.parent_id:''));const source=cell(tr,p.repo||'Source not registered',p.latest_version?.label||'Version not verified');if(p.repo){const a=document.createElement('a');a.href='https://github.com/'+p.repo;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open source repository';source.append(document.createElement('br'),a)}cell(tr,p.observed_ci?.length?p.observed_ci.length+' historical CI run(s)':'No CI evidence','Not equivalent to release certification');const release=cell(tr,'Blocked');release.className='muted';$('rows').append(tr)}$('count').textContent=filtered.length+' / '+data.length+' builds shown';}
for(const id of ['search','status','kind'])$(id).addEventListener(id==='search'?'input':'change',render);render();
}catch(error){const msg=document.createElement('p');msg.setAttribute('role','alert');msg.textContent='Portfolio data unavailable: '+error.message;document.querySelector('.panel').prepend(msg);}
</script></html>
